# HIST Alpha360 滚动模板：7y train + 1y valid，~2y step
# 真正滚动请用: python examples/benchmarks/HIST/rolling_7y1y.py --exp_name=... run
# 不要用裸 qlib.cli.run 做滚动（那只会跑首窗单次任务）
# NOTE: 需 stock2concept / stock_index 等外部 npy 与预训练权重。
qlib_init:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: cn
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
  start_time: '2008-01-01'
  end_time: '2026-10-16'
  fit_start_time: '2008-01-01'
  fit_end_time: '2014-12-31'
  instruments: *market
  infer_processors:
  - class: RobustZScoreNorm
    kwargs:
      fields_group: feature
      clip_outlier: true
  - class: Fillna
    kwargs:
      fields_group: feature
  learn_processors:
  - class: DropnaLabel
  - class: CSRankNorm
    kwargs:
      fields_group: label
  label: ["Ref($close, -2) / Ref($close, -1) - 1"]
port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: '2016-01-01'
    end_time: '2026-10-16'
    account: 100000000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: HIST
    module_path: qlib.contrib.model.pytorch_hist
    kwargs:
      d_feat: 6
      hidden_size: 64
      num_layers: 2
      dropout: 0
      n_epochs: 200
      lr: 1e-4
      early_stop: 20
      metric: ic
      loss: mse
      base_model: LSTM
      model_path: "benchmarks/LSTM/model_lstm_csi300.pkl"
      stock2concept: "benchmarks/HIST/qlib_csi300_stock2concept.npy"
      stock_index: "benchmarks/HIST/qlib_csi300_stock_index.npy"
      GPU: 0
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha360
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        train:
        - '2008-01-01'
        - '2014-12-31'
        valid:
        - '2015-01-01'
        - '2015-12-31'
        test:
        - '2016-01-01'
        - '2026-10-16'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *port_analysis_config
