# XGBoost Alpha158 滚动模板：7y train + 1y valid，~2y step
# 真正滚动请用: python examples/benchmarks/XGBoost/rolling_7y1y.py --exp_name=... run
# 不要用裸 qlib.cli.run 做滚动（那只会跑首窗单次任务）
qlib_init:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: cn
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
  start_time: '2008-01-01'
  end_time: '2026-10-16'
  fit_start_time: '2008-01-01'
  fit_end_time: '2014-12-31'
  instruments: *market
port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: '2016-01-01'
    end_time: '2026-10-16'
    account: 100000000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: XGBModel
    module_path: qlib.contrib.model.xgboost
    kwargs:
      eval_metric: rmse
      colsample_bytree: 0.8879
      eta: 0.0421
      max_depth: 8
      n_estimators: 647
      subsample: 0.8789
      nthread: 20
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha158
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        train:
        - '2008-01-01'
        - '2014-12-31'
        valid:
        - '2015-01-01'
        - '2015-12-31'
        test:
        - '2016-01-01'
        - '2026-10-16'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *port_analysis_config
