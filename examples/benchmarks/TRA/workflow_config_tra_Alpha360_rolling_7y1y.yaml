# TRA Alpha360 滚动模板：7y train + 1y valid，~2y step
# 真正滚动请用: python examples/benchmarks/TRA/rolling_7y1y.py --exp_name=... run
# 不要用裸 qlib.cli.run 做滚动（那只会跑首窗单次任务）
# NOTE: 使用 MTSDatasetH / router；需按 TRA README 准备数据。
qlib_init:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: cn

market: &market csi300
benchmark: &benchmark SH000300

data_handler_config: &data_handler_config
  start_time: '2008-01-01'
  end_time: '2026-10-16'
  fit_start_time: '2008-01-01'
  fit_end_time: '2014-12-31'
  instruments: *market
  infer_processors:
  - class: RobustZScoreNorm
    kwargs:
      fields_group: feature
      clip_outlier: true
  - class: Fillna
    kwargs:
      fields_group: feature
  learn_processors:
  - class: CSRankNorm
    kwargs:
      fields_group: label
  label: ["Ref($close, -2) / Ref($close, -1) - 1"]

num_states: &num_states 3

memory_mode: &memory_mode sample

tra_config: &tra_config
  num_states: *num_states
  rnn_arch: LSTM
  hidden_size: 32
  num_layers: 1
  dropout: 0.0
  tau: 1.0
  src_info: LR_TPE

model_config: &model_config
  input_size: 6
  hidden_size: 64
  num_layers: 2
  rnn_arch: LSTM
  use_attn: true
  dropout: 0.0

port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 50
      n_drop: 5
  backtest:
    start_time: '2016-01-01'
    end_time: '2026-10-16'
    account: 100000000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5

task:
  model:
    class: TRAModel
    module_path: qlib.contrib.model.pytorch_tra
    kwargs:
      tra_config: *tra_config
      model_config: *model_config
      model_type: RNN
      lr: 1e-3
      n_epochs: 100
      max_steps_per_epoch:
      early_stop: 20
      logdir: output/Alpha360
      seed: 0
      lamb: 1.0
      rho: 0.99
      alpha: 0.5
      transport_method: router
      memory_mode: *memory_mode
      eval_train: false
      eval_test: true
      pretrain: true
      init_state:
      freeze_model: false
      freeze_predictors: false
  dataset:
    class: MTSDatasetH
    module_path: qlib.contrib.data.dataset
    kwargs:
      handler:
        class: Alpha360
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        train:
        - '2008-01-01'
        - '2014-12-31'
        valid:
        - '2015-01-01'
        - '2015-12-31'
        test:
        - '2016-01-01'
        - '2026-10-16'
      seq_len: 60
      input_size: 6
      num_states: *num_states
      batch_size: 1024
      n_samples:
      memory_mode: *memory_mode
      drop_last: true
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *port_analysis_config
