# 单因子 MOM12-1 滚动：3y train + 1y valid，约 1y step（顶层 step）
# 窗口对齐 Alpha158_rolling_3y1y，便于与 Alpha158 / L2 对照
# 首窗训 2017–2019 / 验 2020 / 测段模板 2021–2026-11-11；由 rolling_7y1y.py 滑动
# handler 用 MOM12_1（Alpha158 子类），以便 rolling 注入 label 覆盖 horizon
step: 243
qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2017-01-03
    end_time: 2026-11-11
    fit_start_time: 2017-01-03
    fit_end_time: 2019-12-31
    instruments: *market
    # 与 Alpha158 3y1y 同套截面处理
    infer_processors:
        - class: CSZScoreNorm
          kwargs:
              fields_group: feature
              method: robust
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm
          kwargs:
              fields_group: label
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            # 与 Alpha158 3y1y 一致，便于对照
            topk: 10
            n_drop: 1
    backtest:
        start_time: 2021-01-01
        end_time: 2026-11-11
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 20.5700
            lambda_l2: 58.0977
            max_depth: 8
            num_leaves: 210
            num_threads: 20
            early_stopping_rounds: 50
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: MOM12_1
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                # 首窗模板：3y train + 1y valid；test 为全区间，RollingGen 按 step 裁切滑动
                train: [2017-01-03, 2019-12-31]
                valid: [2020-01-01, 2020-12-31]
                test: [2021-01-01, 2026-11-11]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
