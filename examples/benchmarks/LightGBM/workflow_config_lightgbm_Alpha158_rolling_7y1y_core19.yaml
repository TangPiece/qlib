# Alpha158 推荐核心 19 因子滚动模板：7y train + 1y valid，~2y step
# 与 workflow_config_lightgbm_Alpha158_rolling_7y1y.yaml 窗口/策略/超参相同，
# 仅用 FilterCol 保留短名单核心因子；不取反 reverse 列（树模型自学分方向）。
# 真正滚动请显式传 --conf_path，勿改 rolling_7y1y.py 的 DEFAULT_CONF。
qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2008-01-01
    end_time: 2026-10-31
    fit_start_time: 2008-01-01
    fit_end_time: 2014-12-31
    instruments: *market
    # PTYPE_A：learn = infer + learn processors，写在 infer 侧即可同时筛训练/推理列
    infer_processors:
        - class: FilterCol
          kwargs:
              fields_group: feature
              col_list:
                  - KLOW
                  - LOW0
                  - CORD5
                  - MIN5
                  - BETA5
                  - CNTN5
                  - RANK5
                  - ROC5
                  - IMXD5
                  - QTLD5
                  - IMAX5
                  - MA5
                  - RESI20
                  - VSUMP5
                  - IMIN5
                  - SUMD5
                  - QTLU5
                  - VMA60
                  - RSV5
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 10
            n_drop: 1
    backtest:
        start_time: 2016-01-01
        end_time: 2026-10-31
        account: 100000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.2
            subsample: 0.8789
            lambda_l1: 20.5700
            lambda_l2: 58.0977
            max_depth: 8
            num_leaves: 210
            num_threads: 20
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: Alpha158
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                # First rolling window template: 7y train + 1y valid; test span is full horizon
                train: [2008-01-01, 2014-12-31]
                valid: [2015-01-01, 2015-12-31]
                test: [2016-01-01, 2026-10-31]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
