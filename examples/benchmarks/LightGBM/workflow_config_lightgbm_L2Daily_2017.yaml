# L2 百因子 2017 单年回测（train/valid/test 全在 2017，8/2/2 分段）
# 模型与处理器与 workflow_config_lightgbm_L2Daily.yaml 对齐，只改日期
qlib_init:
    provider_uri: "~/.qlib/qlib_data/cn_data"
    region: cn
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
    start_time: 2017-01-03
    end_time: 2017-12-29
    fit_start_time: 2017-01-03
    fit_end_time: 2017-08-31
    instruments: *market
    # 无逐笔成交的停牌日先丢掉，再截面标准化/填空，避免被填成当天中位数
    infer_processors:
        - class: DropnaCols
          kwargs:
              col_list: ["l2_trade_count"]
        - class: CSZScoreNorm
          kwargs:
              fields_group: feature
              method: robust
        - class: Fillna
          kwargs:
              fields_group: feature
    learn_processors:
        - class: DropnaLabel
        - class: CSZScoreNorm
          kwargs:
              fields_group: label
port_analysis_config: &port_analysis_config
    strategy:
        class: TopkDropoutStrategy
        module_path: qlib.contrib.strategy
        kwargs:
            signal: <PRED>
            topk: 50
            n_drop: 5
    backtest:
        start_time: 2017-11-01
        end_time: 2017-12-29
        account: 100000000
        benchmark: *benchmark
        exchange_kwargs:
            limit_threshold: 0.095
            deal_price: close
            open_cost: 0.0005
            close_cost: 0.0015
            min_cost: 5
task:
    model:
        class: LGBModel
        module_path: qlib.contrib.model.gbdt
        kwargs:
            loss: mse
            colsample_bytree: 0.8879
            learning_rate: 0.05
            subsample: 0.8789
            lambda_l1: 205.6999
            lambda_l2: 580.9768
            max_depth: 6
            num_leaves: 64
            num_threads: 20
            early_stopping_rounds: 50
    dataset:
        class: DatasetH
        module_path: qlib.data.dataset
        kwargs:
            handler:
                class: L2Daily
                module_path: qlib.contrib.data.handler
                kwargs: *data_handler_config
            segments:
                train: [2017-01-03, 2017-08-31]
                valid: [2017-09-01, 2017-10-31]
                test: [2017-11-01, 2017-12-29]
    record:
        - class: SignalRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            model: <MODEL>
            dataset: <DATASET>
        - class: SigAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            ana_long_short: False
            ann_scaler: 252
        - class: PortAnaRecord
          module_path: qlib.workflow.record_temp
          kwargs:
            config: *port_analysis_config
