<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LightGBM 滚动训练控制台</title>
  <link rel="stylesheet" href="/static/style.css" />
</head>
<body>
  <header class="header">
    <div>
      <h1>LightGBM 滚动训练控制台</h1>
      <p class="sub">本地静态页 · 调用现有 Python 脚本</p>
    </div>
    <button type="button" id="btnRefresh" class="btn ghost">刷新状态</button>
  </header>

  <main class="layout">
    <section class="card" id="statusCard">
      <h2>状态</h2>
      <div class="grid status-grid">
        <div><span class="label">今天</span><div id="stToday">—</div></div>
        <div><span class="label">本地日历</span><div id="stCalendar">—</div></div>
        <div><span class="label">YAML 结束日</span><div id="stYamlEnds">—</div></div>
        <div><span class="label">当前任务</span><div id="stJob">空闲</div></div>
      </div>
      <p class="hint" id="stMeta"></p>
    </section>

    <section class="card">
      <h2>配置</h2>
      <label class="field">
        <span>工作流 YAML</span>
        <select id="configSelect"></select>
      </label>
    </section>

    <section class="card">
      <h2>更新结束时间</h2>
      <div class="row">
        <label class="field grow">
          <span>结束日</span>
          <input type="date" id="endDate" />
        </label>
        <button type="button" id="btnSetEnd" class="btn primary">写入 YAML</button>
      </div>
      <p class="hint">只改 data_handler / backtest / segments.test 右端，不改 start 与 train/valid。</p>
    </section>

    <section class="card">
      <h2>更新数据</h2>
      <div class="row checks">
        <label><input type="checkbox" id="skipDownload" /> skip-download</label>
        <label><input type="checkbox" id="forceDownload" /> force</label>
      </div>
      <button type="button" id="btnUpdateData" class="btn primary">运行 update_cn_data_daily</button>
    </section>

    <section class="card">
      <h2>执行训练</h2>
      <div class="row">
        <label class="field grow">
          <span>exp_name</span>
          <input type="text" id="expName" placeholder="rolling_lgb_7y1y_YYYYMMDD" />
        </label>
        <label class="field narrow">
          <span>horizon</span>
          <input type="number" id="horizon" value="1" min="1" step="1" />
        </label>
      </div>
      <button type="button" id="btnTrain" class="btn primary">运行 rolling_7y1y</button>
    </section>

    <section class="card">
      <h2>生成结果 HTML</h2>
      <div class="row">
        <label class="field grow">
          <span>exp_name</span>
          <input type="text" id="exportExpName" placeholder="与训练实验名一致" />
        </label>
        <button type="button" id="btnExport" class="btn primary">运行 export_positions_view</button>
      </div>
    </section>

    <section class="card wide">
      <h2>任务日志</h2>
      <pre id="jobLog" class="log">尚无任务</pre>
    </section>

    <section class="card wide">
      <div class="row between">
        <h2>历史训练结果</h2>
        <button type="button" id="btnRefreshResults" class="btn ghost">刷新列表</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>实验名</th>
              <th>类型</th>
              <th>修改时间</th>
              <th>大小</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="resultsBody">
            <tr><td colspan="4">加载中…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" hidden></div>
  <script src="/static/app.js"></script>
</body>
</html>
