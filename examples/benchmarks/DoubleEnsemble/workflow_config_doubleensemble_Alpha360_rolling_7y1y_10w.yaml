# DoubleEnsemble Alpha360 滚动模板：7y train + 1y valid，~2y step
# 本文件为 10 万初始资金（account=100000，topk=10）
# 真正滚动请用:
#   python examples/benchmarks/DoubleEnsemble/rolling_7y1y.py \
#     --conf_path=examples/benchmarks/DoubleEnsemble/workflow_config_doubleensemble_Alpha360_rolling_7y1y_10w.yaml \
#     --exp_name=DoubleEnsemble_Alpha360_rolling_7y1y_10w \
#     run
# 不要用裸 qrun / qlib.cli.run 做滚动（那只会跑首窗单次任务）
qlib_init:
  provider_uri: "~/.qlib/qlib_data/cn_data"
  region: cn
market: &market csi300
benchmark: &benchmark SH000300
data_handler_config: &data_handler_config
  start_time: '2008-01-01'
  end_time: '2026-10-20'
  fit_start_time: '2008-01-01'
  fit_end_time: '2014-12-31'
  instruments: *market
  # Alpha360 原配置不额外做特征标准化，滚动时保持空处理器
  infer_processors: []
  learn_processors:
  - class: DropnaLabel
  - class: CSRankNorm
    kwargs:
      fields_group: label
  label: ["Ref($close, -2) / Ref($close, -1) - 1"]
port_analysis_config: &port_analysis_config
  strategy:
    class: TopkDropoutStrategy
    module_path: qlib.contrib.strategy
    kwargs:
      signal: <PRED>
      topk: 10
      n_drop: 1
  backtest:
    start_time: '2016-01-01'
    end_time: '2026-10-20'
    account: 100000
    benchmark: *benchmark
    exchange_kwargs:
      limit_threshold: 0.095
      deal_price: close
      open_cost: 0.0005
      close_cost: 0.0015
      min_cost: 5
task:
  model:
    class: DEnsembleModel
    module_path: qlib.contrib.model.double_ensemble
    kwargs:
      base_model: "gbm"
      loss: mse
      num_models: 3
      enable_sr: true
      enable_fs: true
      alpha1: 1
      alpha2: 1
      bins_sr: 10
      bins_fs: 5
      decay: 0.5
      sample_ratios:
      - 0.8
      - 0.7
      - 0.6
      - 0.5
      - 0.4
      sub_weights:
      - 1
      - 1
      - 1
      epochs: 136
      colsample_bytree: 0.8879
      learning_rate: 0.0421
      subsample: 0.8789
      lambda_l1: 205.6999
      lambda_l2: 580.9768
      max_depth: 8
      num_leaves: 210
      num_threads: 20
      verbosity: -1
  dataset:
    class: DatasetH
    module_path: qlib.data.dataset
    kwargs:
      handler:
        class: Alpha360
        module_path: qlib.contrib.data.handler
        kwargs: *data_handler_config
      segments:
        # 首窗模板：7y train + 1y valid；test 覆盖完整预测区间，滚动时由 RollingGen 截窗
        train:
        - '2008-01-01'
        - '2014-12-31'
        valid:
        - '2015-01-01'
        - '2015-12-31'
        test:
        - '2016-01-01'
        - '2026-10-20'
  record:
  - class: SignalRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      model: <MODEL>
      dataset: <DATASET>
  - class: SigAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      ana_long_short: false
      ann_scaler: 252
  - class: PortAnaRecord
    module_path: qlib.workflow.record_temp
    kwargs:
      config: *port_analysis_config
